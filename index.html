<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<title>GOOCHI 24/7</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128266;</text></svg>">
<style>
:root{--pink:#ff2a6d; --cyan:#00f0ff;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%, #1a1030 0%, transparent 60%),linear-gradient(180deg,#05050a 0%,#0a0a14 100%);color:#fff;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
.glow{position:fixed;filter:blur(120px);opacity:.25;z-index:0;width:500px;height:500px;border-radius:50%}
.g1{background:var(--pink);top:-150px;left:-100px}.g2{background:var(--cyan);bottom:-150px;right:-100px}
.wrap{position:relative;z-index:1;width:100%;max-width:560px;padding:20px 14px 60px;display:flex;flex-direction:column;align-items:center}
.face-box{position:relative;width:min(92vw,480px);aspect-ratio:1/1;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);margin-top:10px}
.face-box img{width:100%;height:100%;object-fit:cover;display:block}
.air-dot{position:absolute;top:12px;right:12px;width:16px;height:16px;border-radius:50%;background:#0f0;box-shadow:0 0 14px #0f0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.subs{display:flex;gap:22px;justify-content:center;margin-top:20px}
.sub{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 32%, #3a3a4a 0%, #0d0d15 60%, #000 100%);border:3px solid #2a2a3a;display:flex;align-items:center;justify-content:center}
.sub::before{content:'';width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 40% 35%, #555 0%, #1a1a24 55%, #08080c 100%);border:2px solid #333;transform-origin:center}
.eq{display:flex;gap:5px;align-items:flex-end;height:46px;margin-top:22px;width:min(86vw,420px)}
.eq span{flex:1;height:6px;background:linear-gradient(180deg,var(--cyan),var(--pink));border-radius:3px}
.statusline{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#8a8a9a;margin-top:14px}
.player{width:min(86vw,420px);margin-top:10px}
.player audio{width:100%;}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="face-box">
    <img id="goochiImg" src="assets/goochi-face.png" alt="GOOCHI">
    <div class="air-dot" id="airDot"></div>
  </div>
  <div class="subs"><div class="sub" id="subL"><div></div></div><div class="sub" id="subR"><div></div></div></div>
  <div class="eq" id="eq"></div>
  <div class="statusline" id="status">GOOCHI 24/7</div>
  <div class="player">
    <audio id="audio" controls autoplay preload="auto"></audio>
  </div>
</div>
<script>
const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');

// Build decorative equalizer bars (visual only - does NOT touch the audio element)
const eq=document.getElementById('eq'),bars=32,eqels=[];
for(let i=0;i<bars;i++){const s=document.createElement('span');eq.appendChild(s);eqels.push(s);}
let idle=true;
setInterval(()=>{ for(let i=0;i<bars;i++){ eqels[i].style.height=(idle? (4+Math.random()*18) : (4+Math.random()*42))+'px'; } },90);

// List of working stream sources, tried in order until one plays.
const SOURCES=[
  'http://192.168.0.5:8000/goochi',
  'http://90.207.62.227:8000/goochi',
  'http://145.241.238.218:8000/stream'
];
let srcIdx=0;

function attempt(idx){
  const url = SOURCES[idx % SOURCES.length];
  statusEl.textContent = 'Connecting to '+url.replace('http://','')+'...';
  audio.src = url;
  audio.play().then(()=>{ statusEl.textContent = 'LIVE 24/7'; idle=false; })
   .catch(()=>{ statusEl.textContent = 'Tap play to start'; });
}

// Start trying on load
attempt(0);

// If it fails, advance to next source
audio.addEventListener('error', ()=>{ srcIdx++; setTimeout(()=>attempt(srcIdx), 800); });
audio.addEventListener('stalled', ()=>{ if(audio.currentTime===0 && audio.networkState===3){ srcIdx++; attempt(srcIdx);} });

// Subs beat pulse (visual only) - drives off audio playback state
setInterval(()=>{
  const playing = !audio.paused && !audio.ended;
  const d = playing ? (1+Math.random()*0.35) : 1;
  document.getElementById('subL').firstElementChild.style.transform='scale('+d+')';
  document.getElementById('subR').firstElementChild.style.transform='scale('+d+')';
},120);
</script>
</body>
</html>
